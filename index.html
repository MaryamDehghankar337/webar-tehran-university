<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>WebAR - دانشگاه تهران (نسخه دیباگ)</title>

    <!-- کتابخانه‌ها -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-ar@1.2.0/dist/aframe-ar.min.js"></script>

    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }

        /* صفحه لودینگ */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            flex-direction: column;
            transition: opacity 0.5s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* پنل دیباگ (همیشه قابل مشاهده) */
        #debug-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            max-height: 40vh;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            font-size: 0.7rem;
            font-family: 'Courier New', monospace;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #0f0;
            overflow-y: auto;
            z-index: 1000;
            direction: ltr;
            text-align: left;
            line-height: 1.6;
            pointer-events: none;
        }
        #debug-panel .error { color: #ff6b6b; }
        #debug-panel .warn { color: #ffd93d; }
        #debug-panel .success { color: #6bcb77; }
        #debug-panel .info { color: #4d96ff; }

        /* المان‌های معمولی */
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: white;
            background: rgba(0,0,0,0.75);
            padding: 6px 16px;
            border-radius: 25px;
            z-index: 100;
            direction: ltr;
            white-space: nowrap;
            border: 1px solid rgba(255,215,0,0.2);
        }
        #navigator {
            position: absolute;
            bottom: 45vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.75);
            padding: 8px 18px;
            border-radius: 50px;
            z-index: 100;
            gap: 10px;
            border: 1px solid rgba(255,215,0,0.2);
            direction: ltr;
        }
        #navigator .arrow { font-size: 1.8rem; }
        #navigator .text { font-size: 1rem; color: white; }
        #coords {
            position: absolute;
            bottom: calc(45vh + 80px);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.6rem;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 12px;
            z-index: 100;
            direction: ltr;
        }
        #status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }
        #status-dot.active { background: #4CAF50; }
        #status-dot.waiting { background: #FF9800; }
        #status-dot.error { background: #ff1744; }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>

<body>
    <!-- صفحه بارگذاری -->
    <div id="loading">
        <div class="spinner"></div>
        <span>📷 در حال راه‌اندازی...</span>
        <span style="font-size:0.8rem; opacity:0.6; margin-top:10px;">لطفاً صبر کنید</span>
    </div>

    <!-- صحنه AR -->
    <a-scene 
        id="scene"
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
    >
        <a-camera id="camera" gps-camera rotation-reader position="0 1.6 0"></a-camera>

        <a-entity 
            id="target"
            gps-entity-place="latitude: 35.724228; longitude: 51.388218;"
            scale="0.4 0.4 0.4"
        >
            <a-entity look-at="#camera">
                <a-box 
                    color="#FFD700" 
                    opacity="0.95"
                    animation="property: scale; to: 0.5 0.5 0.5; dir: alternate; dur: 1500; loop: true"
                ></a-box>
                <a-text 
                    value="🏛️ دانشکده فنی تهران" 
                    color="white" 
                    position="0 -0.8 0" 
                    scale="0.7 0.7 0.7"
                    align="center"
                    background="color: black; borderRadius: 0.1; padding: 0.1; opacity: 0.7"
                ></a-text>
            </a-entity>
        </a-entity>
    </a-scene>

    <!-- المان‌های UI -->
    <div id="info">
        <span id="status-dot" class="waiting"></span>
        <span id="distance-text">دریافت GPS...</span>
    </div>

    <div id="navigator">
        <div class="arrow" id="arrow">⬆️</div>
        <div class="text" id="direction-text">منتظر موقعیت</div>
    </div>

    <div id="coords">📍 <span id="gps-coords">--</span></div>

    <!-- پنل دیباگ -->
    <div id="debug-panel">
        <div style="color:#888; margin-bottom:5px;">📋 لاگ رویدادها:</div>
        <div id="log-content"></div>
    </div>

    <script>
        // ============================================================
        //  پنل دیباگ - هر پیامی را با زمان و رنگ ثبت می‌کند
        // ============================================================
        const logContainer = document.getElementById('log-content');
        let logCounter = 0;

        function addLog(message, type = 'info') {
            logCounter++;
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.textContent = `[${time}] ${message}`;
            entry.className = type;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            // همچنین در کنسول مرورگر چاپ کن
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        // ============================================================
        //  تنظیمات اولیه
        // ============================================================
        const TARGET_LAT = 35.724228;
        const TARGET_LNG = 51.388218;
        let isGpsReady = false;
        let updateInterval = null;

        const scene = document.getElementById('scene');
        const cameraEl = document.getElementById('camera');
        const loading = document.getElementById('loading');
        const statusDot = document.getElementById('status-dot');
        const distanceText = document.getElementById('distance-text');
        const arrowEl = document.getElementById('arrow');
        const directionText = document.getElementById('direction-text');
        const gpsCoordsEl = document.getElementById('gps-coords');

        // ============================================================
        //  توابع کمکی
        // ============================================================
        function hideLoading() {
            if (loading.classList.contains('hidden')) return;
            loading.classList.add('hidden');
            setTimeout(() => { loading.style.display = 'none'; }, 500);
            addLog('✅ صفحه بارگذاری مخفی شد', 'success');
        }

        function showErrorStatus(msg) {
            statusDot.className = 'error';
            distanceText.textContent = '⚠️ ' + msg;
        }

        function computeBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δλ = (lon2 - lon1) * Math.PI/180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            let θ = Math.atan2(y, x) * 180/Math.PI;
            return (θ + 360) % 360;
        }

        function computeDistance(lat1, lon1, lat2, lon2) {
            const toRad = d => d * Math.PI/180;
            const R = 6371e3;
            const φ1 = toRad(lat1);
            const φ2 = toRad(lat2);
            const Δφ = toRad(lat2 - lat1);
            const Δλ = toRad(lon2 - lon1);
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // ============================================================
        //  به‌روزرسانی ناوبری
        // ============================================================
        function updateNavigation() {
            try {
                const camComp = cameraEl.components['gps-camera'];
                if (!camComp) {
                    addLog('⏳ کامپوننت gps-camera هنوز آماده نشده', 'warn');
                    return;
                }
                if (!camComp.currentCoords) {
                    if (!isGpsReady) {
                        statusDot.className = 'waiting';
                        distanceText.textContent = 'دریافت GPS...';
                        directionText.textContent = 'منتظر موقعیت';
                        gpsCoordsEl.textContent = '--';
                    }
                    return;
                }

                // GPS پیدا شد
                const coords = camComp.currentCoords;
                const userLat = coords.latitude;
                const userLng = coords.longitude;
                
                if (!isGpsReady) {
                    isGpsReady = true;
                    addLog(`📍 موقعیت دریافت شد: ${userLat.toFixed(6)}, ${userLng.toFixed(6)}`, 'success');
                }
                
                statusDot.className = 'active';
                gpsCoordsEl.textContent = `${userLat.toFixed(6)}, ${userLng.toFixed(6)}`;
                
                const dist = computeDistance(userLat, userLng, TARGET_LAT, TARGET_LNG);
                distanceText.textContent = `${Math.round(dist)} متر تا دانشکده`;
                
                const bearingToTarget = computeBearing(userLat, userLng, TARGET_LAT, TARGET_LNG);
                const heading = cameraEl.getAttribute('rotation')?.y || 0;
                
                let diff = (bearingToTarget - heading + 360) % 360;
                let instruction, arrowRot;

                if (diff > 315 || diff <= 45) {
                    instruction = '⬆️ جلو';
                    arrowRot = 'rotate(0deg)';
                } else if (diff > 45 && diff <= 135) {
                    instruction = '➡️ راست';
                    arrowRot = 'rotate(90deg)';
                } else if (diff > 135 && diff <= 225) {
                    instruction = '⬇️ عقب';
                    arrowRot = 'rotate(180deg)';
                } else {
                    instruction = '⬅️ چپ';
                    arrowRot = 'rotate(270deg)';
                }

                if (dist < 10) {
                    directionText.textContent = '🎯 رسیدید!';
                    arrowEl.style.display = 'none';
                    distanceText.textContent = '✅ رسیدید!';
                    addLog('🎯 کاربر به هدف رسید!', 'success');
                } else {
                    directionText.textContent = instruction;
                    arrowEl.style.display = 'block';
                    arrowEl.style.transform = arrowRot;
                }

                // اگر لودینگ هنوز نشان داده می‌شود، مخفی کن
                if (!loading.classList.contains('hidden')) {
                    hideLoading();
                }

            } catch (e) {
                addLog(`❌ خطا در ناوبری: ${e.message}`, 'error');
            }
        }

        // ============================================================
        //  راه‌اندازی و مدیریت رویدادها
        // ============================================================
        function init() {
            addLog('🚀 شروع راه‌اندازی WebAR', 'info');
            addLog(`🎯 هدف: ${TARGET_LAT}, ${TARGET_LNG}`, 'info');

            // ------ 1. بررسی دسترسی به دوربین ------
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                addLog('📷 درخواست دسترسی به دوربین...', 'info');
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function(stream) {
                        addLog('✅ دوربین در دسترس است', 'success');
                        stream.getTracks().forEach(t => t.stop());
                    })
                    .catch(function(err) {
                        addLog(`❌ دوربین در دسترس نیست: ${err.message}`, 'error');
                        showErrorStatus('دوربین در دسترس نیست');
                        hideLoading();
                    });
            } else {
                addLog('⚠️ مرورگر از getUserMedia پشتیبانی نمی‌کند', 'warn');
            }

            // ------ 2. بررسی GPS ------
            if (navigator.geolocation) {
                addLog('📍 درخواست موقعیت GPS...', 'info');
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        addLog(`✅ موقعیت مرورگر: ${pos.coords.latitude}, ${pos.coords.longitude}`, 'success');
                    },
                    function(err) {
                        addLog(`⚠️ خطای GPS مرورگر: ${err.message}`, 'warn');
                    },
                    { enableHighAccuracy: true, timeout: 15000 }
                );
            } else {
                addLog('⚠️ مرورگر از GPS پشتیبانی نمی‌کند', 'warn');
            }

            // ------ 3. رویدادهای صحنه AR.js ------
            scene.addEventListener('loaded', function() {
                addLog('✅ صحنه (scene) بارگذاری شد', 'success');
                hideLoading();
            });

            scene.addEventListener('arjs-error', function(ev) {
                const detail = ev.detail || 'خطای ناشناخته';
                addLog(`❌ خطای AR.js: ${JSON.stringify(detail)}`, 'error');
                showErrorStatus('خطای AR.js');
                hideLoading();
            });

            scene.addEventListener('camera-error', function(ev) {
                const detail = ev.detail || 'خطای ناشناخته';
                addLog(`❌ خطای دوربین: ${JSON.stringify(detail)}`, 'error');
                showErrorStatus('خطای دوربین');
                hideLoading();
            });

            // ------ 4. تایمر اضطراری (آخرین راه) ------
            setTimeout(function() {
                if (!loading.classList.contains('hidden')) {
                    addLog('⏰ تایمر اضطراری: لودینگ به‌زور مخفی شد', 'warn');
                    hideLoading();
                    showErrorStatus('زمان راه‌اندازی تمام شد');
                }
            }, 8000);

            // ------ 5. شروع به‌روزرسانی ناوبری ------
            updateInterval = setInterval(updateNavigation, 500);
            addLog('🔄 به‌روزرسانی ناوبری شروع شد', 'info');
        }

        // ============================================================
        //  گرفتن خطاهای کلی جاوااسکریپت
        // ============================================================
        window.onerror = function(message, source, lineno, colno, error) {
            addLog(`🔥 خطای کلی: ${message} (در ${source}:${lineno})`, 'error');
            hideLoading();
            return false;
        };

        // ============================================================
        //  اجرا
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            addLog('📄 DOM آماده شد', 'info');
            init();
        });

        // ============================================================
        //  پاکسازی
        // ============================================================
        window.addEventListener('beforeunload', function() {
            if (updateInterval) clearInterval(updateInterval);
        });
    </script>
</body>
</html>
