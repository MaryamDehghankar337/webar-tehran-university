<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebAR - دانشکده فنی تهران</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/aframe-gps.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }

        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            flex-direction: column;
            transition: opacity 0.6s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #debug {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 140px;
            max-height: 30vh;
            background: rgba(0,0,0,0.85);
            color: #8f8;
            border: 1px solid #0f0;
            border-radius: 10px;
            padding: 8px;
            font-size: 11px;
            font-family: monospace;
            line-height: 1.6;
            overflow-y: auto;
            z-index: 1000;
            direction: ltr;
        }
        #debug .err { color: #f66; }
        #debug .warn { color: #fd6; }
        #debug .ok { color: #6f6; }
        #debug .info { color: #6cf; }

        #topBar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 14px;
            border: 1px solid rgba(255,215,0,0.3);
            white-space: nowrap;
        }
        #bottomBar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 15px;
            min-width: 180px;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.3);
        }
        #coordsBox {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.6);
            color: rgba(255,255,255,0.8);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            direction: ltr;
        }
        #statusDot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1s infinite;
        }
        #statusDot.waiting { background: #ff9800; }
        #statusDot.active { background: #4caf50; }
        #statusDot.error { background: #f44336; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #retryBtn {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: #FFD700;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
            display: none;
            transition: all 0.3s;
        }
        #retryBtn:hover { background: #ffed4a; transform: translateX(-50%) scale(1.05); }
        #retryBtn:active { transform: translateX(-50%) scale(0.95); }
    </style>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>📷 در حال راه‌اندازی دوربین...</span>
        <span style="font-size:0.9rem; opacity:0.6; margin-top:8px;">لطفاً صبر کنید</span>
    </div>

    <a-scene
        id="scene"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
        renderer="antialias: true; alpha: false;"
        vr-mode-ui="enabled: false"
    >
        <a-camera id="camera" gps-camera position="0 1.6 0"></a-camera>

        <a-entity id="target" visible="false">
            <a-entity look-at="#camera">
                <a-box
                    color="#FFD700"
                    opacity="0.95"
                    scale="0.5 0.5 0.5"
                    animation="property: scale; to: 0.6 0.6 0.6; dir: alternate; dur: 1500; loop: true"
                ></a-box>
                <a-text
                    value="🏛️ دانشکده فنی تهران"
                    color="white"
                    position="0 -0.8 0"
                    scale="0.7 0.7 0.7"
                    align="center"
                    background="color: black; borderRadius: 0.1; padding: 0.1; opacity: 0.7"
                ></a-text>
            </a-entity>
        </a-entity>
    </a-scene>

    <div id="topBar">
        <span id="statusDot" class="waiting"></span>
        <span id="distText">دریافت GPS...</span>
    </div>
    <div id="bottomBar">منتظر موقعیت</div>
    <div id="coordsBox">📍 <span id="coordsText">--</span></div>
    <button id="retryBtn">🔄 تلاش مجدد GPS</button>
    <div id="debug"></div>

    <script>
        // ============================================================
        //  دیباگ
        // ============================================================
        const debugEl = document.getElementById('debug');
        function dbg(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.textContent = `[${time}] ${msg}`;
            line.className = type;
            debugEl.appendChild(line);
            debugEl.scrollTop = debugEl.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }

        // ============================================================
        //  المان‌ها
        // ============================================================
        const loading = document.getElementById('loading');
        const statusDot = document.getElementById('statusDot');
        const distText = document.getElementById('distText');
        const bottomBar = document.getElementById('bottomBar');
        const coordsText = document.getElementById('coordsText');
        const targetEl = document.getElementById('target');
        const cameraEl = document.getElementById('camera');
        const scene = document.getElementById('scene');
        const retryBtn = document.getElementById('retryBtn');

        let userLat = null;
        let userLng = null;
        let targetLat = null;
        let targetLng = null;
        let updateInterval = null;
        let gpsReady = false;
        let gpsAttempted = false;

        // موقعیت پیش‌فرض (تهران - دانشکده فنی)
        const DEFAULT_LAT = 35.7244;
        const DEFAULT_LNG = 51.3878;

        // ============================================================
        //  توابع محاسباتی
        // ============================================================
        function toRad(d) { return d * Math.PI / 180; }

        function computeDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const f1 = toRad(lat1), f2 = toRad(lat2);
            const df = toRad(lat2 - lat1);
            const dl = toRad(lon2 - lon1);
            const a = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function computeBearing(lat1, lon1, lat2, lon2) {
            const f1 = toRad(lat1), f2 = toRad(lat2);
            const dl = toRad(lon2 - lon1);
            const y = Math.sin(dl) * Math.cos(f2);
            const x = Math.cos(f1)*Math.sin(f2) - Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function getDirection(diff) {
            if (diff > 315 || diff <= 45) return '⬆️ جلو';
            if (diff > 45 && diff <= 135) return '➡️ راست';
            if (diff > 135 && diff <= 225) return '⬇️ عقب';
            return '⬅️ چپ';
        }

        // ============================================================
        //  مخفی کردن لودینگ
        // ============================================================
        function hideLoading() {
            if (loading.classList.contains('hidden')) return;
            loading.classList.add('hidden');
            setTimeout(() => { loading.style.display = 'none'; }, 500);
            dbg('✅ بارگذاری کامل شد', 'ok');
        }

        // ============================================================
        //  تنظیم موقعیت هدف (با موقعیت داده شده)
        // ============================================================
        function setTargetPosition(lat, lng, isDefault = false) {
            targetLat = lat;
            targetLng = lng;
            targetEl.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lng};`);
            targetEl.setAttribute('visible', 'true');
            dbg(`🎯 هدف در موقعیت ${lat.toFixed(6)}, ${lng.toFixed(6)} قرار گرفت${isDefault ? ' (پیش‌فرض)' : ''}`, 'ok');
            bottomBar.textContent = '🎯 شیء در جلوی شماست';
            coordsText.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            if (!loading.classList.contains('hidden')) hideLoading();

            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(updateNav, 500);
            dbg('🔄 ناوبری فعال شد', 'info');
            retryBtn.style.display = 'none';
        }

        // ============================================================
        //  به‌روزرسانی ناوبری
        // ============================================================
        function updateNav() {
            if (userLat === null || userLng === null || targetLat === null || targetLng === null) return;

            try {
                const dist = computeDistance(userLat, userLng, targetLat, targetLng);
                distText.textContent = `${Math.round(dist)} متر تا دانشکده`;

                const bearing = computeBearing(userLat, userLng, targetLat, targetLng);
                const heading = cameraEl.getAttribute('rotation')?.y || 0;
                const diff = (bearing - heading + 360) % 360;

                bottomBar.textContent = (dist < 10) ? '🎯 رسیدید!' : getDirection(diff);
            } catch (e) {
                dbg(`❌ خطا: ${e.message}`, 'err');
            }
        }

        // ============================================================
        //  دریافت موقعیت از GPS مرورگر
        // ============================================================
        function getLocation() {
            if (!navigator.geolocation) {
                dbg('❌ GPS پشتیبانی نمی‌شود', 'err');
                statusDot.className = 'error';
                distText.textContent = 'GPS پشتیبانی نمی‌شود';
                setTargetPosition(DEFAULT_LAT, DEFAULT_LNG, true);
                return;
            }

            if (gpsAttempted) {
                dbg('🔄 تلاش مجدد GPS...', 'info');
            } else {
                dbg('📍 درخواست موقعیت GPS...', 'info');
            }
            gpsAttempted = true;
            statusDot.className = 'waiting';
            distText.textContent = 'دریافت GPS...';
            bottomBar.textContent = 'در حال دریافت موقعیت...';
            retryBtn.style.display = 'none';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    dbg(`✅ موقعیت دریافت شد: ${userLat.toFixed(6)}, ${userLng.toFixed(6)}`, 'ok');
                    statusDot.className = 'active';
                    gpsReady = true;
                    setTargetPosition(userLat, userLng);
                },
                (err) => {
                    dbg(`❌ خطای GPS: ${err.message}`, 'err');
                    statusDot.className = 'error';
                    distText.textContent = 'خطا در GPS';
                    bottomBar.textContent = '⚠️ GPS در دسترس نیست';
                    // استفاده از موقعیت پیش‌فرض
                    userLat = DEFAULT_LAT;
                    userLng = DEFAULT_LNG;
                    setTargetPosition(DEFAULT_LAT, DEFAULT_LNG, true);
                    // نمایش دکمه تلاش مجدد
                    retryBtn.style.display = 'block';
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // ============================================================
        //  راه‌اندازی
        // ============================================================
        function init() {
            dbg('🚀 شروع WebAR', 'info');

            scene.addEventListener('loaded', () => {
                dbg('✅ صحنه بارگذاری شد', 'ok');
                // اگر تا ۳ ثانیه بعد GPS نیامد، لودینگ را مخفی کن
                setTimeout(() => {
                    if (!loading.classList.contains('hidden')) {
                        dbg('⏰ تایمر اضطراری: لودینگ مخفی شد', 'warn');
                        hideLoading();
                    }
                }, 3000);
            });

            scene.addEventListener('arjs-error', (ev) => {
                dbg(`❌ AR.js error: ${JSON.stringify(ev.detail)}`, 'err');
                hideLoading();
            });

            scene.addEventListener('camera-error', (ev) => {
                dbg(`❌ دوربین error: ${JSON.stringify(ev.detail)}`, 'err');
                hideLoading();
            });

            // درخواست GPS
            getLocation();

            // اگر GPS تا ۱۵ ثانیه جواب نداد، از پیش‌فرض استفاده کن
            setTimeout(() => {
                if (!gpsReady && targetLat === null) {
                    dbg('⏰ زمان GPS به پایان رسید، استفاده از پیش‌فرض', 'warn');
                    userLat = DEFAULT_LAT;
                    userLng = DEFAULT_LNG;
                    setTargetPosition(DEFAULT_LAT, DEFAULT_LNG, true);
                    statusDot.className = 'error';
                    retryBtn.style.display = 'block';
                }
            }, 16000);

            // دکمه تلاش مجدد
            retryBtn.addEventListener('click', () => {
                dbg('🔄 کاربر درخواست تلاش مجدد GPS کرد', 'info');
                getLocation();
            });
        }

        window.onerror = function(msg, src, line) {
            dbg(`🔥 خطا: ${msg} (${src}:${line})`, 'err');
            hideLoading();
        };

        document.addEventListener('DOMContentLoaded', () => {
            dbg('📄 DOM آماده', 'info');
            init();
        });

        window.addEventListener('beforeunload', () => {
            if (updateInterval) clearInterval(updateInterval);
        });
    </script>
</body>
</html>
