<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>WebAR - دانشکده فنی</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- AR.js location-based -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-gps.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    #topBar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      border: 1px solid rgba(255,215,0,0.25);
      white-space: nowrap;
    }

    #bottomBar {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 15px;
      border: 1px solid rgba(255,215,0,0.25);
      text-align: center;
      min-width: 220px;
    }

    #coords {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.8);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      direction: ltr;
      font-family: monospace;
    }

    #hint {
      position: absolute;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.45);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    #log {
      position: absolute;
      right: 10px;
      left: 10px;
      bottom: 130px;
      max-height: 28vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.82);
      color: #8df58d;
      border: 1px solid rgba(0,255,0,0.45);
      border-radius: 12px;
      padding: 10px;
      font-size: 11px;
      line-height: 1.6;
      direction: ltr;
      font-family: monospace;
      display: none;
    }

    #toggleLog {
      position: absolute;
      right: 10px;
      top: 18px;
      pointer-events: auto;
      background: rgba(0,0,0,0.72);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="topBar">در حال دریافت GPS...</div>
    <div id="hint">GPS را روشن کن و گوشی را آرام بچرخان</div>
    <div id="coords">--</div>
    <div id="bottomBar">منتظر موقعیت...</div>
    <button id="toggleLog">لاگ</button>
    <div id="log"></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-camera gps-camera rotation-reader></a-camera>

    <a-entity
      id="poi"
      gps-entity-place="latitude: 35.724228; longitude: 51.388218;"
    >
      <a-text
        value="دانشکده فنی تهران"
        look-at="[gps-camera]"
        align="center"
        color="#FFFFFF"
        scale="80 80 80"
        position="0 40 0"
      ></a-text>

      <a-box
        color="#FFD700"
        opacity="0.9"
        scale="20 20 20"
        position="0 10 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
      ></a-box>
    </a-entity>
  </a-scene>

  <script>
    const TARGET_LAT = 35.724228;
    const TARGET_LNG = 51.388218;

    const topBar = document.getElementById("topBar");
    const bottomBar = document.getElementById("bottomBar");
    const coordsBox = document.getElementById("coords");
    const logBox = document.getElementById("log");
    const toggleLogBtn = document.getElementById("toggleLog");

    let logVisible = false;
    toggleLogBtn.addEventListener("click", () => {
      logVisible = !logVisible;
      logBox.style.display = logVisible ? "block" : "none";
    });

    function addLog(msg) {
      const t = new Date().toLocaleTimeString();
      const line = document.createElement("div");
      line.textContent = `[${t}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
      console.log(msg);
    }

    function toRad(d) {
      return d * Math.PI / 180;
    }

    function computeDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const f1 = toRad(lat1);
      const f2 = toRad(lat2);
      const df = toRad(lat2 - lat1);
      const dl = toRad(lon2 - lon1);
      const a =
        Math.sin(df / 2) * Math.sin(df / 2) +
        Math.cos(f1) * Math.cos(f2) *
        Math.sin(dl / 2) * Math.sin(dl / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function computeBearing(lat1, lon1, lat2, lon2) {
      const f1 = toRad(lat1);
      const f2 = toRad(lat2);
      const dl = toRad(lon2 - lon1);
      const y = Math.sin(dl) * Math.cos(f2);
      const x =
        Math.cos(f1) * Math.sin(f2) -
        Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
      let b = Math.atan2(y, x) * 180 / Math.PI;
      return (b + 360) % 360;
    }

    function directionText(diff) {
      if (diff > 315 || diff <= 45) return "جلو";
      if (diff > 45 && diff <= 135) return "راست";
      if (diff > 135 && diff <= 225) return "عقب";
      return "چپ";
    }

    window.addEventListener("load", () => {
      addLog("page loaded");

      const camera = document.querySelector("[gps-camera]");
      if (!camera) {
        addLog("gps-camera not found");
        topBar.textContent = "خطا: gps-camera پیدا نشد";
        return;
      }

      addLog("gps-camera found");

      setInterval(() => {
        const comp = camera.components["gps-camera"];
        if (!comp || !comp.currentCoords) {
          topBar.textContent = "در حال دریافت GPS...";
          bottomBar.textContent = "منتظر موقعیت...";
          return;
        }

        const lat = comp.currentCoords.latitude;
        const lng = comp.currentCoords.longitude;
        coordsBox.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

        const dist = computeDistance(lat, lng, TARGET_LAT, TARGET_LNG);
        topBar.textContent = `${Math.round(dist)} متر تا مقصد`;

        const rotation = camera.getAttribute("rotation");
        const heading = rotation && typeof rotation.y === "number" ? rotation.y : 0;
        const bearing = computeBearing(lat, lng, TARGET_LAT, TARGET_LNG);
        const diff = (bearing - heading + 360) % 360;

        if (dist < 20) {
          bottomBar.textContent = "رسیدی به مقصد";
        } else {
          bottomBar.textContent = `جهت تقریبی: ${directionText(diff)}`;
        }
      }, 1000);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            addLog(`browser gps ok: ${pos.coords.latitude}, ${pos.coords.longitude}`);
          },
          (err) => {
            addLog(`browser gps error: ${err.message}`);
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      } else {
        addLog("geolocation not supported");
      }
    });
  </script>
</body>
</html>
